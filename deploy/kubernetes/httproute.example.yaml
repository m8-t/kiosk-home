# Not part of the kustomization.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiosk-home
  labels:
    app.kubernetes.io/name: kiosk-home
spec:
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
  hostnames:
    - home.example.org
  rules:
    - backendRefs:
        - name: kiosk-home
          port: 8080
