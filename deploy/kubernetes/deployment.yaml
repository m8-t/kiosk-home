apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiosk-home
  labels:
    app.kubernetes.io/name: kiosk-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kiosk-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiosk-home
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kiosk-home
          image: ghcr.io/m8-t/kiosk-home:0.3.0
          envFrom:
            - configMapRef:
                name: kiosk-home
            - secretRef:
                name: kiosk-home
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kiosk-home-links
        - name: tmp
          emptyDir: {}
