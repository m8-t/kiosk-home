apiVersion: v1
kind: ConfigMap
metadata:
  name: kiosk-home
  labels:
    app.kubernetes.io/name: kiosk-home
data:
  # true shows the Lights tile and view and needs the Hue settings; false hides them
  # and the Hue host and app key are not needed.
  KIOSK_LIGHTS: "true"
  # IP address of the Hue bridge.
  KIOSK_HUE_HOST: "192.0.2.196"
  # The bridge id ("bridgeid" in https://<hue-ip>/api/config); turns on the
  # certificate check for the Hue bridge.
  KIOSK_HUE_BRIDGE_ID: "001788fffe000000"
  # debug, info, warning or error.
  KIOSK_LOG_LEVEL: "info"
---
# Mounted at /config. Edits apply without a restart once the kubelet syncs
# the volume (up to about a minute).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiosk-home-links
  labels:
    app.kubernetes.io/name: kiosk-home
data:
  links.json: |
    [
      {"title": "Music", "url": "https://music.example.org", "icon": "🎵"},
      {"title": "Cameras", "url": "https://cam.example.org", "icon": "📷"},
      {"title": "Router", "url": "http://192.0.2.1", "open": "tab"}
    ]
