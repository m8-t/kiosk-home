<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Home</title>
<link rel="stylesheet" href="/assets/kiosk.css">
</head>
<body>
<div id="status" class="status" role="status" hidden></div>
<header id="bar" class="bar" hidden>
  <button id="home-btn" type="button" class="home-btn" aria-label="Home"><span class="ic" id="home-ic"></span><span>Home</span></button>
  <h1 id="bar-title" class="bar-title"></h1>
</header>
<main id="view-home" class="page home-page" aria-label="Apps">
  <ul id="tiles" class="tiles"></ul>
</main>
<main id="view-lights" class="page" aria-label="Lights" hidden>
  <div id="all-row" class="all-row" hidden>
    <div class="all-text"><div class="all-name">All lights</div><div id="all-value" class="room-value"></div></div>
    <button id="all-power" type="button" class="power power-lg" aria-label="Toggle all lights"></button>
  </div>
  <p id="rooms-empty" class="sub" hidden>No rooms found</p>
  <ul id="rooms" class="rooms"></ul>
</main>
<div id="frames" class="frames" hidden></div>
<script type="module" src="/assets/kiosk.js"></script>
</body>
</html>
